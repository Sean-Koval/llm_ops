  services:
    # Model API Service (using minimal server for testing)
    llm-api:
      build: .
      ports:
        - "8000:8000"
      volumes:
        - ./models:/app/models
        - ./config_samples:/app/config_samples
      environment:
        - LOG_LEVEL=INFO
      entrypoint: ["python", "scripts/minimal_server.py"]
      command: []  # Empty command to avoid any command-line arguments
      restart: unless-stopped

    # MLflow tracking server
    mlflow:
      image: ghcr.io/mlflow/mlflow:latest
      ports:
        - "5000:5000"
      volumes:
        - ./mlflow:/mlflow
      environment:
        - MLFLOW_TRACKING_URI=/mlflow
      command: mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0
      restart: unless-stopped

    # Sample Prometheus for monitoring
    prometheus:
      image: prom/prometheus:latest
      ports:
        - "9090:9090"
      volumes:
        - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      restart: unless-stopped

    # Sample Grafana for visualization
    grafana:
      image: grafana/grafana:latest
      user: "1000"  # Set user ID to fix permission issues
      ports:
        - "3000:3000"
      volumes:
        - ./monitoring/grafana:/var/lib/grafana
      depends_on:
        - prometheus
      restart: unless-stopped